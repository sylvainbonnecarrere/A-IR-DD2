name: Runtime

'on':
  push:
    branches:
      - main
    paths:
      - backend/docker/runtime/**
      - backend/scripts/runtime/**
      - backend/package.json
      - backend/package-lock.json
      - scripts/ci/verify-node25-runtime.mjs
      - .github/workflows/runtime.yml
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node25-runtime-slice:
    name: Node25 Runtime Slice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.runCommand({ ping: 1 }).ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://127.0.0.1:27018/irdd-test
      JWT_SECRET: ci-jwt-secret-not-for-production
      ENCRYPTION_KEY: ci-master-encryption-key-32-chars-minimum-length-required
      PYTHON_BIN: python3
      PYTHON_EXECUTABLE: python3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run Node25 runtime validation slice
        run: npm run ci:node25:runtime

  runtime-ci:
    name: Runtime CI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Rebuild and verify runtime images
        run: npm --prefix backend run runtime:ci

  runtime-scan:
    name: Runtime Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Trivy CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Build runtime images for scanning
        run: npm --prefix backend run runtime:ci

      - name: Scan runtime images
        run: npm --prefix backend run runtime:scan
