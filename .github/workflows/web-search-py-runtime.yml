name: Web Search Py Runtime

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  web-search-py-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run focused web_search_py regression suite
        run: npm run test:web-search-py

      - name: Rebuild Docker runtime images and smoke test provisioning
        working-directory: backend
        run: npm run runtime:ci